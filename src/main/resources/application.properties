spring.application.name=management-system
server.port=${PORT:8080}

# SECURITY: DB credentials were previously hardcoded here and committed to
# the repo. Since they were already exposed, rotate this database's
# password at your Aiven console before deploying this change. These now
# read from environment variables, with the old values kept only as local
# defaults so the app still runs for you today — set DB_URL / DB_USERNAME /
# DB_PASSWORD in your real deployment (Render/Railway/Docker env, etc.) so
# the actual secret never lives in source control again.
# Database settings with automatic H2 fallback if DB_URL is not set on Render
spring.datasource.url=${DB_URL:jdbc:h2:mem:student_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# Where uploaded profile photos are written/served from. Point this (via the
# UPLOAD_DIR env var) at a mounted persistent volume in production — a plain
# container filesystem is wiped on every redeploy/restart, which is why
# saved photos can appear to vanish after some time.
app.upload.dir=${UPLOAD_DIR:uploads}